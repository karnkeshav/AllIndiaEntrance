<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All India Entrance Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <nav class="glass-nav sticky top-0 z-50 p-4 border-b border-white/10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                <i class="fa-solid fa-graduation-cap"></i> AllIndiaEntrance
            </h1>
            <div class="text-xs text-gray-400">Powered by Gemini</div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-10 flex-grow">
        
        <div class="flex justify-center mb-12 space-x-4">
            <div class="phase-card active text-center">
                <div class="text-xs text-blue-300 uppercase tracking-wider">Current</div>
                <div class="text-xl font-bold text-white">Phase 1: UG</div>
            </div>
            <div class="phase-card opacity-50 text-center grayscale">
                <div class="text-xs text-gray-500 uppercase tracking-wider">Coming Soon</div>
                <div class="text-xl font-bold text-gray-400">Phase 2: PG</div>
            </div>
        </div>

        <div id="loading-spinner" class="text-center py-20 hidden">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
            <p class="mt-4 text-gray-400">Fetching latest syllabus data...</p>
        </div>

        <div id="stream-selector" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            </div>

        <div id="roadmap-view" class="hidden animate-fade-in">
            <button onclick="resetView()" class="mb-6 text-gray-400 hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Back to Streams
            </button>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="col-span-1 lg:col-span-2">
                    <div class="glass-panel p-8 rounded-2xl border border-blue-500/30 relative overflow-hidden h-full">
                        <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fa-solid fa-sun text-9xl"></i></div>
                        
                        <div class="relative z-10">
                            <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs uppercase font-bold tracking-wider">Master Exam</span>
                            <h2 id="master-name" class="text-4xl font-bold mt-2 mb-2">Loading...</h2>
                            <p id="master-desc" class="text-gray-300 mb-6">The central syllabus standard for this stream.</p>
                            
                            <button onclick="downloadCurrentSyllabus()" class="bg-white text-blue-900 hover:bg-gray-200 px-6 py-3 rounded-lg font-bold flex items-center gap-2 transition shadow-lg shadow-blue-900/50">
                                <i class="fa-solid fa-file-pdf"></i> Download Official Syllabus
                            </button>

                            <div class="mt-8">
                                <h3 class="text-lg font-semibold border-b border-white/10 pb-2 mb-4">Key Subjects</h3>
                                <ul id="master-subjects" class="space-y-2 text-gray-300">
                                    </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-1 flex flex-col gap-4">
                    <h3 class="text-xl font-semibold text-gray-400 pl-2">Associated Exams</h3>
                    <div id="satellite-list" class="flex flex-col gap-4">
                        </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/5 py-6 text-center text-gray-500 text-sm">
        <p>One Nation, One Syllabus Concept.</p>
    </footer>

    <script src="js/pdf-maker.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
